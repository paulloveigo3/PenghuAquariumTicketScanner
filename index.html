<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Code 智能驗票系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Roboto+Mono:wght@400;700&family=Material+Icons+Round&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="header" id="headerBar">
    <div class="header-left">
      <div class="app-title">
        前台過票系統
        <span class="version-tag">v3.0</span>
      </div>
    </div>

    <div class="header-center">
      <div class="today-visitor-chip" id="todayVisitorChip" aria-live="polite">
        <span class="today-visitor-label">當日來館人數</span>
        <span class="today-visitor-value" id="todayVisitorCount">--</span>
        <span class="today-visitor-unit">人</span>
      </div>
    </div>

    <div class="header-controls">
      <button class="bt-status" id="btStatusBtn" type="button" aria-label="藍牙連線狀態">
        <span class="material-icons-round bt-icon">bluetooth</span>
        <span id="btText">未連線</span>
        <span class="status-dot" aria-hidden="true"></span>
      </button>
      <button class="cam-btn" id="cameraBtn" type="button" aria-label="開啟相機">
        <span class="material-icons-round">qr_code_scanner</span>
      </button>
    </div>
  </div>

  <main class="main-container">
    <section class="display-card waiting" id="displayCard">
      <div class="display-label">掃描結果</div>
      <div class="display-value" id="displayValue">READY</div>

      <div class="user-info-box" id="userInfoBox" hidden>
        <div class="info-line" id="userInfoLine1">--</div>
        <div class="info-line sub" id="userInfoLine2">--</div>
      </div>
    </section>

    <section class="log-container">
      <div class="log-title">
        <span>SESSION LOG</span>
        <div class="sync-status">
          <div class="sync-dot" id="syncDot"></div>
          <span id="syncText">待機中</span>
        </div>
        <button class="icon-btn" id="clearLogsBtn" type="button" aria-label="清除紀錄">
          <span class="material-icons-round">delete_sweep</span>
        </button>
      </div>
      <div class="log-list" id="logList"></div>
    </section>
  </main>

  <footer class="footer">
    <button class="action-btn" id="historyBtn" type="button">
      <span class="material-icons-round">history</span>
      <div>歷史</div>
    </button>
    <button class="action-btn btn-upload" id="syncBtn" type="button">
      <span class="material-icons-round">cloud_upload</span>
      <div>同步</div>
    </button>
    <button class="action-btn" id="reloadBtn" type="button">
      <span class="material-icons-round">refresh</span>
      <div>重整</div>
    </button>
  </footer>

  <input id="scanInputTrap" type="text" readonly autocomplete="off" />

  <div id="scanner-modal" class="modal scanner-modal" aria-hidden="true">
    <div class="scanner-shell">
      <div class="scanner-topbar">
        <div class="scanner-title">請將 QR Code 對準框內</div>
        <button class="icon-btn scanner-close-btn" id="closeScannerBtn" type="button" aria-label="關閉掃描器">
          <span class="material-icons-round">close</span>
        </button>
      </div>
      <div class="scanner-reader-wrap">
        <div id="qr-reader" class="qr-reader"></div>
      </div>
      <div class="scanner-hint">掃描成功後會自動返回主畫面並驗證</div>
    </div>
  </div>

  <div id="pairing-modal" class="modal" aria-hidden="true">
    <div class="pairing-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=GATELINK_PAIRING_ACTION" class="pairing-img" alt="配對 QR Code">
      <div class="pairing-text">請掃描此碼確認連線</div>
      <div class="pairing-sub">掃描後將自動完成配對</div>
      <button class="primary-btn" id="manualConnectBtn" type="button">手動強制連線</button>
      <button class="secondary-btn" id="closePairingBtn" type="button">取消</button>
    </div>
  </div>

  <div id="keyboard-modal" class="modal" aria-hidden="true">
    <div class="pairing-box keyboard-box">
      <span class="material-icons-round keyboard-icon">keyboard_alt</span>
      <div class="pairing-text">輸入法檢查</div>
      <div class="pairing-sub">
        請切換至 <b>英文 (US)</b><br>
        若使用注音，掃描可能失敗。
      </div>
      <div class="keyboard-test-box">
        <div class="keyboard-test-label">點擊下方框框試打，確認按 A 不會輸入 ㄇ</div>
        <input type="text" id="keyboardTestInput" placeholder="試打區" />
      </div>
      <button class="primary-btn" id="confirmKeyboardBtn" type="button">已切換英文，開始作業</button>
    </div>
  </div>

 

  <div id="entry-modal" class="modal active entry-modal" aria-hidden="false">
  <div class="entry-shell">
    <div id="entrySelectPage" class="entry-page">
      <div class="entry-title">請選擇作業模式</div>
      <div class="entry-subtitle">手機版可直接進入，電腦版需先登入帳密</div>

      <div class="entry-choice-stack">
        <button class="entry-choice-btn" id="enterMobileBtn" type="button">
          <span class="material-icons-round entry-choice-icon">smartphone</span>
          <div class="entry-choice-label">手機版</div>
          <div class="entry-choice-desc">直接進入掃描作業</div>
        </button>

        <button class="entry-choice-btn" id="enterDesktopBtn" type="button">
          <span class="material-icons-round entry-choice-icon">desktop_windows</span>
          <div class="entry-choice-label">電腦版</div>
          <div class="entry-choice-desc">進入帳密登入畫面</div>
        </button>
      </div>
    </div>

    <div id="entryDesktopPage" class="entry-page" hidden>
      <div class="entry-title">電腦版登入</div>
      <div class="entry-subtitle">請輸入白名單帳密</div>

      <div class="entry-form">
        <input
          id="desktopAccountInput"
          class="entry-input"
          type="text"
          placeholder="帳號"
          autocomplete="username"
        />
        <input
          id="desktopPasswordInput"
          class="entry-input"
          type="password"
          placeholder="密碼"
          autocomplete="current-password"
        />
      </div>

      <div id="entryMessage" class="entry-message"></div>

      <div class="entry-btn-row">
        <button class="secondary-btn entry-back-btn" id="entryBackBtn" type="button">上一頁</button>
        <button class="primary-btn" id="desktopLoginBtn" type="button">登入</button>
      </div>
    </div>
  </div>
</div>
  <script src="./app.js?v=20260410-23" defer></script>
</body>
</html>
